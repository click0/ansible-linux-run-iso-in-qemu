name: CI

# ansible-lint on the role, and a syntax check of every task file (tests/syntax-check.sh) on the
# oldest ansible-core the role supports (2.15; 2.15 and 2.16 are the ones for EL7 targets) and on
# the current one. Nothing here runs the role against a host.

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Pinned: a new ansible-lint release adds rules, and that should be a change of its own.
      - name: Install ansible-lint and ansible.posix
        run: |
          python -m pip install 'ansible-lint==26.10.1'
          ansible-galaxy collection install 'ansible.posix>=1.5.0'
      - name: ansible-lint
        run: ansible-lint --nocolor

  syntax:
    name: Syntax check (ansible-core ${{ matrix.ansible-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ansible.posix 2.x does not support ansible-core 2.15.
          - {ansible-core: '2.15', python: '3.11', posix: '>=1.5.0,<2.0.0'}
          - {ansible-core: '2.16', python: '3.12', posix: '>=1.5.0'}
          - {ansible-core: 'latest', python: '3.13', posix: '>=1.5.0'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ansible-core ${{ matrix.ansible-core }} and ansible.posix
        env:
          CORE: ${{ matrix.ansible-core }}
          POSIX: ${{ matrix.posix }}
        run: |
          if [ "$CORE" = latest ]; then spec=ansible-core; else spec="ansible-core==$CORE.*"; fi
          python -m pip install "$spec"
          ansible-galaxy collection install "ansible.posix$POSIX"
          ansible --version
      - name: Syntax check
        run: tests/syntax-check.sh
