---

# yum, not dnf: EL7 has no dnf, and EL7 targets need ansible-core 2.15 or 2.16 (README), where yum is a
# module of its own; ansible-lint, run with a newer ansible-core that redirects yum to dnf, asks for dnf.

- name: '{{ ansible_os_family }} | Install EPEL repository'
  ansible.builtin.yum:  # noqa: fqcn[action-core]
    name:
      - epel-release
    state: present
    update_cache: true
  when: (__lisoq_qemu_package | bool)

- name: '{{ ansible_os_family }} | Install qemu-system-x86'
  ansible.builtin.yum:  # noqa: fqcn[action-core]
    name:
      - qemu-system-x86
      - seabios
    state: present
    enablerepo: 'epel'
  ignore_errors: '{{ ansible_check_mode }}'
  when: (__lisoq_qemu_package | bool)

# The static QEMU and UEFI archives are extracted on the target: tar is not in a minimal EL8/EL9 install.
- name: '{{ ansible_os_family }} | Install tar (and unzip) for the QEMU archives'
  ansible.builtin.yum:  # noqa: fqcn[action-core]
    name: >-
      {{ ['tar'] + (['unzip'] if (([__lisoq_static_local, __lisoq_static_url]
                                    + ([lisoq_qemu_static_custom_uefi_url] if (__lisoq_qemu_uefi | bool) else []))
                                   | select('search', '[.]zip$') | list) else []) }}
    state: present
  when: (__lisoq_static_local is truthy) or (__lisoq_static_url is truthy) or (__lisoq_qemu_uefi | bool)

- name: '{{ ansible_os_family }} | Install rsync'
  ansible.builtin.yum:  # noqa: fqcn[action-core]
    name:
      - rsync
    state: present
  when: (__lisoq_iso_local is truthy) or (__lisoq_static_local is truthy)

# iptables-services is not used by the role; on EL8+ it is only in EPEL. On EL9 'iptables' could also
# resolve to iptables-legacy from EPEL, so the nft variant of the base OS is named explicitly.
- name: '{{ ansible_os_family }} | Install iptables'
  ansible.builtin.yum:  # noqa: fqcn[action-core]
    name: >-
      {{ ['iptables', 'iptables-services'] if (ansible_distribution_major_version | int < 8)
         else (['iptables'] if (ansible_distribution_major_version | int == 8) else ['iptables-nft']) }}
  when: (lisoq_firewall_acl_enable | bool)

