---

- name: '{{ ansible_os_family }} | Install EPEL repository'
  ansible.builtin.yum:
    name:
      - epel-release
    state: present
    update_cache: true
  when: (__lisoq_qemu_package | bool)

- name: '{{ ansible_os_family }} | Install qemu-system-x86'
  ansible.builtin.yum:
    name:
      - qemu-system-x86
      - seabios
    state: present
    enablerepo: 'epel'
  ignore_errors: '{{ ansible_check_mode }}'
  when: (__lisoq_qemu_package | bool)

- name: '{{ ansible_os_family }} | Install rsync'
  ansible.builtin.yum:
    name:
      - rsync
    state: present
  when: (__lisoq_iso_local is truthy) or (__lisoq_static_local is truthy)

- name: '{{ ansible_os_family }} | Run commands before install iptables'
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
  ignore_errors: true
  when: (lisoq_firewall_acl_enable | bool)

- name: '{{ ansible_os_family }} | Install iptables'
  ansible.builtin.yum:
    name:
      - iptables
      - iptables-services
#      - iptables-utils
  when: (lisoq_firewall_acl_enable | bool)

