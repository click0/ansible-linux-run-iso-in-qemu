---

# Rules are inserted at the top of INPUT, so existing ACCEPT rules cannot bypass them.
# DROP is inserted first and the whitelist after it, which puts ACCEPT rules above DROP.

# IPv4
- name: 'Disable IPv4 connections on tcp ports: {{ lisoq_firewall_acl_ports }}'
  ansible.builtin.iptables:
    chain: INPUT
    action: insert
    jump: DROP
    protocol: tcp
    ip_version: ipv4
    destination_ports:
      - '{{ lisoq_firewall_acl_ports | join(",") }}'

- name: 'Insert a INPUT rule to whitelist IPv4 in iptables to ports: {{ lisoq_firewall_acl_ports }}'
  ansible.builtin.iptables:
    chain: INPUT
    action: insert
    protocol: tcp
    source: '{{ item }}'
    destination_ports:
      - '{{ lisoq_firewall_acl_ports | join(",") }}'
    ip_version: ipv4
    jump: ACCEPT
  with_items: '{{ lisoq_firewall_acl_ipv4_white }}'

# IPv6
- name: 'Disable IPv6 connections on tcp ports: {{ lisoq_firewall_acl_ports }}'
  ansible.builtin.iptables:
    chain: INPUT
    action: insert
    jump: DROP
    protocol: tcp
    ip_version: ipv6
    destination_ports:
      - '{{ lisoq_firewall_acl_ports | join(",") }}'

- name: 'Insert a INPUT rule to whitelist IPv6 in iptables to ports: {{ lisoq_firewall_acl_ports }}'
  ansible.builtin.iptables:
    chain: INPUT
    action: insert
    protocol: tcp
    source: '{{ item }}'
    destination_ports:
      - '{{ lisoq_firewall_acl_ports | join(",") }}'
    ip_version: ipv6
    jump: ACCEPT
  with_items: '{{ lisoq_firewall_acl_ipv6_white }}'
