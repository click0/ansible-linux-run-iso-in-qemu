---

# The ACL lives in its own chain LISOQ_QEMU, which is flushed and rebuilt on every run, so an address
# removed from the whitelists (or an old address of the Ansible host) loses access. INPUT only jumps
# to it, from the top, so existing ACCEPT rules cannot bypass it. Rules that 1.1.0-1.4.0 inserted
# directly into INPUT end up below the jump and no longer decide anything for the current ports.
# DROP is added right after the flush and the whitelist is inserted above it, so the ports are not
# left open while the chain is rebuilt.

- name: 'Create the LISOQ_QEMU chain'
  ansible.builtin.iptables:
    chain: LISOQ_QEMU
    chain_management: true
    ip_version: '{{ item }}'
  loop:
    - ipv4
    - ipv6

- name: 'Flush the LISOQ_QEMU chain'
  ansible.builtin.iptables:
    chain: LISOQ_QEMU
    flush: true
    ip_version: '{{ item }}'
  loop:
    - ipv4
    - ipv6

- name: 'Disable connections on tcp ports: {{ __lisoq_acl_ports }}'
  ansible.builtin.iptables:
    chain: LISOQ_QEMU
    jump: DROP
    protocol: tcp
    ip_version: '{{ item }}'
    destination_ports:
      - '{{ __lisoq_acl_ports | join(",") }}'
  loop:
    - ipv4
    - ipv6

# IPv4
- name: 'Whitelist IPv4 for tcp ports: {{ __lisoq_acl_ports }}'
  ansible.builtin.iptables:
    chain: LISOQ_QEMU
    action: insert
    protocol: tcp
    source: '{{ item }}'
    destination_ports:
      - '{{ __lisoq_acl_ports | join(",") }}'
    ip_version: ipv4
    jump: ACCEPT
  with_items: '{{ __lisoq_acl_ipv4_white }}'

# IPv6
- name: 'Whitelist IPv6 for tcp ports: {{ __lisoq_acl_ports }}'
  ansible.builtin.iptables:
    chain: LISOQ_QEMU
    action: insert
    protocol: tcp
    source: '{{ item }}'
    destination_ports:
      - '{{ __lisoq_acl_ports | join(",") }}'
    ip_version: ipv6
    jump: ACCEPT
  with_items: '{{ __lisoq_acl_ipv6_white }}'

- name: 'Jump from INPUT to the LISOQ_QEMU chain'
  ansible.builtin.iptables:
    chain: INPUT
    action: insert
    protocol: tcp
    jump: LISOQ_QEMU
    ip_version: '{{ item }}'
  loop:
    - ipv4
    - ipv6
