---

# Python may be missing on a fresh rescue system, so facts are not available yet.
- name: Run apt-get update and install python via raw module
  ansible.builtin.raw: >-
    if command -v apt-get >/dev/null 2>&1 && ! /usr/bin/python3 -c 'import apt' >/dev/null 2>&1; then
    apt-get update && apt-get -y install python3-apt && echo LISOQ_INSTALLED;
    fi
  register: __lisoq_raw_python
  changed_when: ('LISOQ_INSTALLED' in __lisoq_raw_python.stdout)
  ignore_errors: true

- name: Collect minimal facts to detect the OS family
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - 'min'

# Like tasks/*/not-supported.yml: other hosts are skipped (vars/ has only Debian and RedHat).
- name: Unsupported OS family
  ansible.builtin.debug:
    msg: >-
      The role supports the Debian and RedHat OS families; {{ inventory_hostname }} is {{ ansible_distribution }}
      ({{ ansible_os_family }}), so it is skipped.
  when: ansible_os_family not in ['Debian', 'RedHat']

- name: End the play for unsupported hosts
  ansible.builtin.meta: end_host
  when: ansible_os_family not in ['Debian', 'RedHat']

- name: Install python3-apt, gpg, ca-certificates
  ansible.builtin.apt:
    name:
      - python3-apt
      - gpg
      - ca-certificates
    #  - wget
    #      - tmux
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'
