---

# Python may be missing on a fresh rescue system, so facts are not available yet.
- name: run apt-get update and install python via raw module
  raw: >-
    if command -v apt-get >/dev/null 2>&1; then
    apt-get update && apt-get -y install python3-apt;
    fi
  ignore_errors: true

- name: Collect minimal facts to detect the OS family
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - 'min'

- name: Install python3-apt, gpg, ca-certificates
  apt:
    name:
      - python3-apt
      - gpg
      - ca-certificates
    #  - wget
    #      - tmux
    update_cache: true
  when: ansible_os_family == 'Debian'
