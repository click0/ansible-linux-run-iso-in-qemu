---

# A second QEMU cannot open the same disks and ports, so do not start it on re-run.
- name: Check whether QEMU is already running
  command:
    argv:
      - pgrep
      - -f
      - '^([^ ]*/)?qemu-system-x86_64( |$)'
  register: lisoq_qemu_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: QEMU is already running, a new instance will not be started
  debug:
    msg: 'QEMU is already running (PID {{ lisoq_qemu_running.stdout_lines | join(", ") }}). Stop it to apply new settings.'
  when: lisoq_qemu_running.rc == 0

- name: Starting installed qemu
  command: >
    qemu-system-x86_64 {{ lisoq_qemu_args }}
  when: (lisoq_qemu_install | bool) and (lisoq_qemu_running.rc != 0)

- name: Starting qemu (lisoq_qemu_static_custom_url)
  block:
    - name: 'Create a directory
    "{{ (lisoq_ramdisk_path|length > 0) | ternary(lisoq_ramdisk_path,lisoq_ramdisk_another_path) }}{{ lisoq_qemu_static_custom_relative_dir }}"
     if it does not exist'
      ansible.builtin.file:
        path: >-
          {{ (lisoq_ramdisk_path|length > 0)
          | ternary(lisoq_ramdisk_path,lisoq_ramdisk_another_path) }}{{ lisoq_qemu_static_custom_relative_dir }}
        state: directory
        mode: '0755'

    - name: Starting qemu qemu-system-x86_64
      command: >-
        {{ (lisoq_ramdisk_path|length > 0)
        | ternary(lisoq_ramdisk_path,lisoq_ramdisk_another_path) }}/qemu-system-x86_64
        -L {{ (lisoq_ramdisk_path|length > 0)
        | ternary(lisoq_ramdisk_path,lisoq_ramdisk_another_path) }}/{{ lisoq_qemu_static_custom_relative_dir }}
        {{ lisoq_qemu_args }}
      args:
        chdir: '{{ (lisoq_ramdisk_path|length > 0) |
                ternary(lisoq_ramdisk_path,lisoq_ramdisk_another_path) }}{{ lisoq_qemu_static_custom_relative_dir }}'
      ignore_errors: '{{ ansible_check_mode }}'
  when: >-
    ((lisoq_qemu_static_custom_local is truthy) or (lisoq_qemu_static_custom_url is truthy)) and
    (lisoq_qemu_running.rc != 0)
