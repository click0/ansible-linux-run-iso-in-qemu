---

# A second QEMU cannot open the same disks and ports, so do not start it on re-run.
# Only the VM of this role counts ('-name lisoq'; older role versions are recognised by the SSH port
# forwarding), not other VMs on the host, e.g. from libvirt.
- name: Check whether QEMU is already running
  command:
    argv:
      - pgrep
      - -f
      - >-
        ^([^ ]*/)?qemu-system-x86_64 .*(-name lisoq( |$)
        {%- if lisoq_qemu_args_port_ssh is truthy %}|hostfwd=tcp::{{ lisoq_qemu_args_port_ssh }}-{% endif %})
  register: __lisoq_qemu_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: QEMU is already running, a new instance will not be started
  debug:
    msg: 'QEMU is already running (PID {{ __lisoq_qemu_running.stdout_lines | join(", ") }}). Stop it to apply new settings.'
  when: __lisoq_qemu_running.rc == 0

- name: Starting installed qemu
  command: >
    qemu-system-x86_64 {{ __lisoq_qemu_cmd }}
  when: (__lisoq_qemu_package | bool) and (__lisoq_qemu_running.rc != 0)

- name: Starting qemu (lisoq_qemu_static_custom_url)
  block:
    - name: 'Create a directory
    "{{ __lisoq_ramdisk_dir }}{{ lisoq_qemu_static_custom_relative_dir }}"
     if it does not exist'
      ansible.builtin.file:
        path: >-
          {{ __lisoq_ramdisk_dir }}{{ lisoq_qemu_static_custom_relative_dir }}
        state: directory
        mode: '0755'

    - name: Starting qemu qemu-system-x86_64
      command: >-
        {{ __lisoq_ramdisk_dir }}/qemu-system-x86_64
        -L {{ __lisoq_ramdisk_dir }}/{{ lisoq_qemu_static_custom_relative_dir }}
        {{ __lisoq_qemu_cmd }}
      args:
        chdir: '{{ __lisoq_ramdisk_dir }}{{ lisoq_qemu_static_custom_relative_dir }}'
      ignore_errors: '{{ ansible_check_mode }}'
  when: >-
    ((__lisoq_static_local is truthy) or (__lisoq_static_url is truthy)) and
    (__lisoq_qemu_running.rc != 0)
