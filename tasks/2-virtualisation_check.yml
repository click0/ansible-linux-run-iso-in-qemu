---

# source:
# https://github.com/redhat-openstack/ansible-role-tripleo-parts/blob/master/parts/kvm/tasks/main.yml

# Grab CPU flags from `/proc/cpuinfo` and put the result into the
# `cpu_flags_cmd` variable.
- name: get cpu flags
  command: >
    awk -F: '/^flags/ {print $2; exit}' /proc/cpuinfo
  register: lisoq_cpu_flags_cmd
  changed_when: false
  check_mode: false

# Extract the flags into a list variable named `cpu_flags`.
- name: set cpu flags fact
  set_fact:
    lisoq_cpu_flags: "{{ lisoq_cpu_flags_cmd.stdout.split() }}"

# Immediately load the appropriate kvm vendor module: `vmx` is Intel VT-x, `svm` is AMD-V.
# Without these flags (e.g. a VPS without nested virtualization) QEMU runs without KVM,
# so a failed modprobe must not stop the role.
- name: load kvm module [intel]
  command: modprobe kvm_intel
  changed_when: false
  failed_when: false
  when: "'vmx' in lisoq_cpu_flags"

- name: load kvm module [amd]
  command: modprobe kvm_amd
  changed_when: false
  failed_when: false
  when: "'svm' in lisoq_cpu_flags"

- name: check /dev/kvm
  ansible.builtin.stat:
    path: /dev/kvm
  register: lisoq_dev_kvm

# Enable [nested virtualization][nested]. Set the `lisoq_nested_virt` fact
# to `true` if the CPU has the `vmx` or `svm` flag and /dev/kvm is available.
#
# [nested]: https://www.kernel.org/doc/Documentation/virtual/kvm/nested-vmx.txt
- name: set lisoq_nested_virt fact
  set_fact:
    lisoq_nested_virt: >-
      {{ (('vmx' in lisoq_cpu_flags) or ('svm' in lisoq_cpu_flags)) and lisoq_dev_kvm.stat.exists }}

- name: KVM is not available
  debug:
    msg: 'KVM is not available (no vmx/svm CPU flag or no /dev/kvm), QEMU will run without hardware acceleration.'
  when: (not lisoq_nested_virt | bool)
