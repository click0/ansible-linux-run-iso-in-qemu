---

- name: Collect facts (get_facts)
  ansible.builtin.setup:
    gather_subset:
      - 'all'
# need: ansible_devices, ansible_processor_vcpus
#       ansible_os_family, ansible_distribution, ansible_distribution_major_version, ansible_*_mb

# Variable setup.
- name: Include OS-specific variables.
  include_vars: "{{ ansible_os_family }}.yml"

- name: Include distribution and version-specific vars.
  include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
      skip: true

# User settings (lisoq_*) are never modified by the role: set_fact has a lower precedence than
# extra vars (-e), role params and include_role vars, so a modified value would be silently ignored
# when the user passes the setting that way. Everything derived goes to internal __lisoq_* facts.

# Priority QEMU:
#  - lisoq_qemu_static_custom_enable
#  - lisoq_qemu_install
#
# Priority ISO:
#   - lisoq_iso_file_local
#   - lisoq_iso_file_remote
#   - lisoq_iso_file_url
- name: Resolve role settings
  set_fact:
    __lisoq_qemu_static: '{{ lisoq_qemu_static_custom_enable | bool }}'
    __lisoq_qemu_package: '{{ (lisoq_qemu_install | bool) and (not lisoq_qemu_static_custom_enable | bool) }}'
    __lisoq_static_local: >-
      {{ lisoq_qemu_static_custom_local
         if ((lisoq_qemu_static_custom_enable | bool) and (lisoq_qemu_static_custom_local is truthy)) else '' }}
    __lisoq_static_url: >-
      {{ lisoq_qemu_static_custom_url
         if ((lisoq_qemu_static_custom_enable | bool) and (lisoq_qemu_static_custom_local is falsy)
             and (lisoq_qemu_static_custom_url is truthy)) else '' }}
    __lisoq_iso_local: "{{ lisoq_iso_file_local if (lisoq_iso_file_local is truthy) else '' }}"
    __lisoq_iso_remote: >-
      {{ lisoq_iso_file_remote
         if ((lisoq_iso_file_local is falsy) and (lisoq_iso_file_remote is truthy)) else '' }}
    __lisoq_iso_url: >-
      {{ lisoq_iso_file_url
         if ((lisoq_iso_file_local is falsy) and (lisoq_iso_file_remote is falsy) and (lisoq_iso_file_url is truthy))
         else '' }}
    __lisoq_qemu_cpu: '{{ lisoq_qemu_cpu if (lisoq_qemu_cpu is truthy) else (ansible_processor_vcpus | default(1)) }}'
    __lisoq_qemu_vnc_port: '{{ (lisoq_qemu_args_port_vnc | int < 5900) | ternary(5901, lisoq_qemu_args_port_vnc | int) }}'
    # Firewall ports = the ports QEMU actually listens on: SSH/RDP forwarding if set, and the VNC port
    # after the same correction as below (values under 5900 mean 5901).
    __lisoq_acl_ports: >-
      {{ ([lisoq_qemu_args_port_ssh, lisoq_qemu_args_port_rdp] | select('truthy') | map('string') | list)
         + [(lisoq_qemu_args_port_vnc | int < 5900) | ternary(5901, lisoq_qemu_args_port_vnc | int) | string] }}
    __lisoq_ramdisk_dir: "{{ lisoq_ramdisk_path if (lisoq_ramdisk_path is truthy) else lisoq_ramdisk_another_path }}"
    __lisoq_total_need_ram: >-
      {{ lisoq_total_need_ram if (lisoq_total_need_ram is truthy)
         else [lisoq_ramdisk_size | int + lisoq_qemu_ram | int, __need_ram | int] | max }}

# Firewall whitelist: user networks plus the address the Ansible control node connects from, as seen by
# the server. SSH_CONNECTION is 'client_ip client_port server_ip server_port'; it is read without become,
# because sudo removes it from the environment.
- name: Find the address of the Ansible control node as seen by the server
  command: printenv SSH_CONNECTION
  become: false
  register: __lisoq_ssh_connection
  changed_when: false
  failed_when: false
  check_mode: false
  when: (lisoq_firewall_acl_enable | bool) and (lisoq_firewall_acl_allow_ansible_ip | bool)

- name: Set the firewall whitelists
  set_fact:
    __lisoq_ansible_ip: "{{ (__lisoq_ssh_connection.stdout | default('')).split() | first | default('') }}"
    __lisoq_acl_ipv4_white: "{{ lisoq_firewall_acl_ipv4_white | default([]) | list }}"
    __lisoq_acl_ipv6_white: "{{ lisoq_firewall_acl_ipv6_white | default([]) | list }}"

- name: Add the address of the Ansible control node to the firewall whitelist
  set_fact:
    __lisoq_acl_ipv4_white: >-
      {{ __lisoq_acl_ipv4_white + ([__lisoq_ansible_ip ~ '/32'] if (':' not in __lisoq_ansible_ip) else []) }}
    __lisoq_acl_ipv6_white: >-
      {{ __lisoq_acl_ipv6_white + ([__lisoq_ansible_ip ~ '/128'] if (':' in __lisoq_ansible_ip) else []) }}
  when: (__lisoq_ansible_ip | length > 0)

- name: The address of the Ansible control node is unknown
  debug:
    msg: >-
      Could not detect the address the Ansible control node connects from (no SSH_CONNECTION, e.g. a local
      connection). Only lisoq_firewall_acl_ipv4_white / lisoq_firewall_acl_ipv6_white are allowed to reach
      the QEMU ports.
  when: (lisoq_firewall_acl_enable | bool) and (lisoq_firewall_acl_allow_ansible_ip | bool) and
        (__lisoq_ansible_ip | length == 0)

# Without -vnc QEMU opens a GTK/SDL window and fails on a headless server.
- name: Check lisoq_qemu_vnc_type
  fail:
    msg: "lisoq_qemu_vnc_type must be 'local' or 'share', got '{{ lisoq_qemu_vnc_type }}'."
  when: lisoq_qemu_vnc_type not in ['local', 'share']

- name: We use fail if we do not have enough RAM
  fail:
    msg: "not enough RAM!"
  when: (ansible_memory_mb.real.total < 512) or (ansible_memory_mb.real.total < (__lisoq_total_need_ram | int))

- name: We use fail if we do not have enough RAM for QEMU
  fail:
    msg: "QEMU need more RAM ( > 256 MiB )!"
  when: ((lisoq_qemu_ram | int) < 256 ) or (ansible_memory_mb.nocache.free < 256)

- name: if RamDISK enabled
  block:

    # lisoq_ramdisk_path is preferred. lisoq_ramdisk_another_path is used when the first one is already
    # mounted with another filesystem (e.g. a server disk mounted on /mnt in rescue mode).
    # An existing tmpfs is reused and only grown, never shrunk.
    # ansible_mounts skips tmpfs, so ask findmnt. Output: FSTYPE SOURCE SIZE AVAIL (bytes), last line = top mount.
    - name: Find existing mounts of the ramdisk paths
      command:
        argv:
          - findmnt
          - -n
          - -r
          - -b
          - -o
          - FSTYPE,SOURCE,SIZE,AVAIL
          - --mountpoint
          - '{{ item }}'
      loop:
        - '{{ lisoq_ramdisk_path }}'
        - '{{ lisoq_ramdisk_another_path }}'
      register: __lisoq_ramdisk_findmnt
      changed_when: false
      failed_when: __lisoq_ramdisk_findmnt.rc > 1
      check_mode: false

    - name: Parse existing mounts of the ramdisk paths
      set_fact:
        __lisoq_ramdisk_main_mount: >-
          {{ ((__lisoq_ramdisk_findmnt.results[0].stdout_lines | last)
              if __lisoq_ramdisk_findmnt.results[0].stdout_lines else '').split() }}
        __lisoq_ramdisk_other_mount: >-
          {{ ((__lisoq_ramdisk_findmnt.results[1].stdout_lines | last)
              if __lisoq_ramdisk_findmnt.results[1].stdout_lines else '').split() }}

    - name: Choose the ramdisk path
      set_fact:
        __lisoq_ramdisk_dir: >-
          {{ ((__lisoq_ramdisk_main_mount | first | default('tmpfs')) == 'tmpfs')
             | ternary(lisoq_ramdisk_path, lisoq_ramdisk_another_path) }}
        __lisoq_ramdisk_mount: >-
          {{ ((__lisoq_ramdisk_main_mount | first | default('tmpfs')) == 'tmpfs')
             | ternary(__lisoq_ramdisk_main_mount, __lisoq_ramdisk_other_mount) }}

    - name: Fail if neither ramdisk path is free or tmpfs
      fail:
        msg: >-
          Cannot create the ramdisk: {{ __lisoq_ramdisk_dir }} is mounted with
          {{ __lisoq_ramdisk_mount | first }}. Set lisoq_ramdisk_path or lisoq_ramdisk_another_path
          to a free directory.
      when: (__lisoq_ramdisk_mount | first | default('tmpfs')) != 'tmpfs'

    - name: Calculate the ramdisk size
      set_fact:
        __lisoq_ramdisk_size_mib: >-
          {{ [ ((__lisoq_ramdisk_mount[2] | default(0) | int) / 1048576) | round(0, 'ceil') | int,
               (((__lisoq_ramdisk_mount[2] | default(0) | int)
                 - (__lisoq_ramdisk_mount[3] | default(0) | int)) / 1048576) | round(0, 'ceil') | int
               + (lisoq_ramdisk_size | int) ] | max }}

    - name: Ensure ramdisk directory exists
      ansible.builtin.file:
        dest: '{{ __lisoq_ramdisk_dir }}'
        mode: '01777'
        state: directory
      when: (__lisoq_ramdisk_mount is falsy)

    - name: Ensure ramdisk {{ __lisoq_ramdisk_dir }} is mounted
      ansible.posix.mount:
        path: '{{ __lisoq_ramdisk_dir }}'
        src: "{{ __lisoq_ramdisk_mount[1] | default('tmpfs') }}"
        fstype: tmpfs
        opts: 'size={{ __lisoq_ramdisk_size_mib }}M'
        state: ephemeral
  when: (lisoq_ramdisk_enable | bool)

# QEMU command line: lisoq_qemu_args from the user plus the options added by the role.

- name: Start the QEMU command line with lisoq_qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ lisoq_qemu_args }}'

- name: Add net user options to qemu_args. Only port {{ lisoq_qemu_args_port_ssh }}
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -net user,hostfwd=tcp::{{ lisoq_qemu_args_port_ssh }}-:{{ lisoq_iso_file_ssh_port }}'
  when: (lisoq_qemu_args_port_ssh is truthy) and (lisoq_qemu_args_port_rdp is falsy)

- name: Add net user options to qemu_args. Only port {{ lisoq_qemu_args_port_rdp }}
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -net user,hostfwd=tcp::{{ lisoq_qemu_args_port_rdp }}-:{{ lisoq_qemu_args_port_rdp }}'
  when: (lisoq_qemu_args_port_ssh is falsy) and (lisoq_qemu_args_port_rdp is truthy)

- name: Add net user options to qemu_args. Both ports - {{ lisoq_qemu_args_port_ssh }} and {{ lisoq_qemu_args_port_rdp }}
  set_fact:
    # https://stackoverflow.com/a/71651490/12646191
    __lisoq_qemu_cmd: >-
      {{ __lisoq_qemu_cmd }} -net user,
      {#- -#}
      hostfwd=tcp::{{ lisoq_qemu_args_port_ssh }}-:{{ lisoq_iso_file_ssh_port }},
      {#- -#}
      hostfwd=tcp::{{ lisoq_qemu_args_port_rdp }}-:{{ lisoq_qemu_args_port_rdp }}
  when: (lisoq_qemu_args_port_ssh is truthy) and (lisoq_qemu_args_port_rdp is truthy)

- name: Add keyboard layot option to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -k en-us'
  when: (__lisoq_qemu_package | bool)

- name: Add keyboard layot option to qemu_args (if using qemu-static-custom).
  set_fact:
    # broken keymaps
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -k keymaps/common'
  when: (__lisoq_static_local is truthy) or (__lisoq_static_url is truthy)

- name: Add the local ISO option to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -cdrom {{ __lisoq_ramdisk_dir }}/{{ __lisoq_iso_local | basename }}'
  when: (__lisoq_iso_local is truthy)

- name: Add the remote ISO option to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -cdrom {{ __lisoq_iso_remote }}'
  when: (__lisoq_iso_remote is truthy)

- name: Add an ISO URL option to qemu_args. We will download this ISO later.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -cdrom {{ __lisoq_ramdisk_dir }}/{{ __lisoq_iso_url | basename }}'
  when: (__lisoq_iso_url is truthy)

- name: Add the count of CPU to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -smp {{ __lisoq_qemu_cpu }}'

- name: Set how much RAM to allocate to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -m {{ lisoq_qemu_ram }}M'

- name: Select disks for QEMU (lisoq_qemu_disk or autodetect).
  set_fact:
    __lisoq_qemu_disk_autodetect: '{{ lisoq_qemu_disk is falsy }}'
    __lisoq_qemu_disks: >-
      {{ (lisoq_qemu_disk | list) if (lisoq_qemu_disk is truthy)
         else (ansible_devices.keys()
               | reject('match', '^(' ~ (lisoq_qemu_exclude_disk_regular_list | join('|')) ~ ')[0-9]+')
               | difference(lisoq_qemu_exclude_disk) | list) }}

# A disk is in use by the host if it or anything on it is mounted or used as swap, if an active
# md array, LVM volume, dm-crypt/multipath device sits on it (they write to the disk even when not
# mounted, e.g. an md resync), or if it belongs to an imported ZFS pool (lsblk shows no mountpoint
# for ZFS). Writing to such a disk from QEMU at the same time corrupts it.
- name: Find mount points and active devices on the selected disks
  command:
    argv:
      - lsblk
      - -nr
      - -o
      - NAME,TYPE,MOUNTPOINT
      - '/dev/{{ item }}'
  loop: '{{ __lisoq_qemu_disks }}'
  register: __lisoq_qemu_disk_mounts
  changed_when: false
  check_mode: false

- name: List devices of imported ZFS pools
  command:
    argv:
      - zpool
      - status
      - -L
      - -P
  register: __lisoq_zpool_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: (__lisoq_qemu_disks | length > 0)

- name: Set the list of disks in use by the host
  set_fact:
    __lisoq_qemu_disk_in_use: >-
      {{ (__lisoq_qemu_disk_mounts.results | default([])
         | selectattr('stdout', 'search', '(?m)^\S+ \S+ \S')
         | map(attribute='item') | list
         + __lisoq_qemu_disk_mounts.results | default([])
         | selectattr('stdout', 'search', '(?m)^\S+ (?!(disk|part|loop|rom)( |$))\S+')
         | map(attribute='item') | list
         + __lisoq_qemu_disk_mounts.results | default([])
         | selectattr('stdout', 'search', '(?m)^(' ~ ((__lisoq_zpool_status.stdout | default(''))
                      | regex_findall('/dev/([A-Za-z0-9._-]+)') | map('regex_escape') | join('|')
                      | default('(?!)', true)) ~ ') ')
         | map(attribute='item') | list)
         | unique }}

- name: Fail if an explicitly listed disk is in use by the host
  fail:
    msg: >-
      Disks {{ __lisoq_qemu_disk_in_use | join(', ') }} from lisoq_qemu_disk are in use by the host (mounted, swap,
      an active md array / LVM / dm device, or an imported ZFS pool). Unmount/stop them first
      (e.g. umount, swapoff, mdadm --stop --scan, vgchange -an, zpool export), remove them from
      lisoq_qemu_disk, or set lisoq_qemu_disk_allow_in_use to true.
  when: (not __lisoq_qemu_disk_autodetect | bool) and (__lisoq_qemu_disk_in_use | length > 0) and
        (not lisoq_qemu_disk_allow_in_use | bool)

- name: Exclude autodetected disks in use by the host
  set_fact:
    __lisoq_qemu_disks: '{{ __lisoq_qemu_disks | difference(__lisoq_qemu_disk_in_use) }}'
  when: (__lisoq_qemu_disk_autodetect | bool) and (__lisoq_qemu_disk_in_use | length > 0) and
        (not lisoq_qemu_disk_allow_in_use | bool)

- name: Report disks excluded from QEMU
  debug:
    msg: >-
      Disks in use by the host (mounted, swap, active md/LVM/dm, imported ZFS) are not passed to QEMU:
      {{ __lisoq_qemu_disk_in_use | join(", ") }}. To pass them, stop what uses them first
      (e.g. mdadm --stop --scan, vgchange -an, zpool export) and re-run the role.
  when: (__lisoq_qemu_disk_autodetect | bool) and (__lisoq_qemu_disk_in_use | length > 0) and
        (not lisoq_qemu_disk_allow_in_use | bool)

- name: Reset the large disk flag
  set_fact:
    __lisoq_qemu_disk_large: false

- name: Detect disk size largest 2TiB
  set_fact:
    __lisoq_qemu_disk_large: true
  loop: '{{ __lisoq_qemu_disks }}'
  when: >-
    (ansible_devices[item].sectors|int * ansible_devices[item].sectorsize|int) > (2 * 1024 * 1024 * 1024 * 1024)

# UEFI is opt-in: SeaBIOS sees disks larger than 2 TiB as well (the 2 TiB limit is MBR's), and many ISOs
# (e.g. mfsbsd 12.2, the default before 1.3.0) have no UEFI boot loader, so forcing UEFI made them unbootable.
- name: Decide whether the UEFI firmware is used.
  set_fact:
    __lisoq_qemu_uefi: '{{ lisoq_qemu_uefi | bool }}'

- name: Fail if UEFI is requested without static QEMU
  fail:
    msg: >-
      lisoq_qemu_uefi requires lisoq_qemu_static_custom_enable: true and lisoq_qemu_static_custom_uefi_url
      (the UEFI firmware comes from that archive).
  when: (__lisoq_qemu_uefi | bool) and
        ((not __lisoq_qemu_static | bool) or (lisoq_qemu_static_custom_uefi_url | length == 0))

- name: Hint about UEFI for disks larger than 2 TiB
  debug:
    msg: >-
      A disk larger than 2 TiB is passed to QEMU. It is fully usable in BIOS mode; set lisoq_qemu_uefi: true
      only if the OS must be installed/booted in UEFI mode and the ISO supports UEFI boot.
  when: (__lisoq_qemu_disk_large | bool) and (not __lisoq_qemu_uefi | bool)

# uefi.bin is extracted from lisoq_qemu_static_custom_uefi_url in upload_files.yml (same condition).
- name: Add UEFI firmware to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -bios {{ __lisoq_ramdisk_dir }}/uefi.bin'
  when: (__lisoq_qemu_uefi | bool)

# Disks go to the IDE bus as before while they fit: the 'pc' machine has 4 IDE slots and -cdrom takes one.
# More disks ("machine type does not support if=ide,bus=2,unit=0" otherwise) are all attached to
# AHCI (SATA) controllers, 6 ports each; AHCI drivers are built into Windows, Linux and FreeBSD,
# and SeaBIOS boots from it.
- name: Count free IDE slots.
  set_fact:
    __lisoq_qemu_ide_free: >-
      {{ 4 - (((__lisoq_iso_local is truthy) or (__lisoq_iso_remote is truthy) or (__lisoq_iso_url is truthy))
              | ternary(1, 0)) }}

- name: Add a list of disk device options to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }}
 -drive ''file=/dev/{{ __lisoq_qemu_disks | join(",format=raw'' -drive ''file=/dev/") }},format=raw''
'
  when: (__lisoq_qemu_disks | length > 0) and (__lisoq_qemu_disks | length <= __lisoq_qemu_ide_free | int)

- name: Add disks to qemu_args on AHCI (SATA) controllers.
  set_fact:
    __lisoq_qemu_cmd: >-
      {{ __lisoq_qemu_cmd }}
      {%- for c in range(((__lisoq_qemu_disks | length) + 5) // 6) %} -device ahci,id=lisoq_ahci{{ c }}{% endfor %}
      {%- for d in __lisoq_qemu_disks %} -drive file=/dev/{{ d }},format=raw,if=none,id=lisoq_disk{{ loop.index0 }}
      -device ide-hd,drive=lisoq_disk{{ loop.index0 }},bus=lisoq_ahci{{ loop.index0 // 6 }}.{{ loop.index0 % 6 }}
      {%- endfor %}
  when: (__lisoq_qemu_disks | length > __lisoq_qemu_ide_free | int)

- name: Add start VNC to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -vnc 127.0.0.1:{{ __lisoq_qemu_vnc_port | int - 5900 }}'
  when: lisoq_qemu_vnc_type == 'local'

- name: Add start VNC to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -vnc :{{ __lisoq_qemu_vnc_port | int - 5900 }}'
  when: lisoq_qemu_vnc_type == 'share'

- name: Add option to boot qemu from ISO to qemu_args.
  set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -boot {{ (lisoq_qemu_boot_once_cd | bool) | ternary("once=", "") }}d'
  when: (lisoq_qemu_boot_cd | bool)
