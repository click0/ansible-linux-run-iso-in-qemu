---

- name: Collect facts (get_facts)
  ansible.builtin.setup:
    gather_subset:
      - 'all'
# need: ansible_devices, ansible_processor_vcpus
#       ansible_os_family, ansible_distribution, ansible_distribution_major_version, ansible_*_mb

# Variable setup.
- name: Include OS-specific variables.
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Include distribution and version-specific vars.
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
      skip: true

# User settings (lisoq_*) are never modified by the role: set_fact has a lower precedence than
# extra vars (-e), role params and include_role vars, so a modified value would be silently ignored
# when the user passes the setting that way. Everything derived goes to internal __lisoq_* facts.

# Priority QEMU:
#  - lisoq_qemu_static_custom_enable
#  - lisoq_qemu_install
#
# Priority ISO:
#   - lisoq_iso_file_local
#   - lisoq_iso_file_remote
#   - lisoq_iso_file_url
- name: Resolve role settings
  ansible.builtin.set_fact:
    __lisoq_qemu_static: '{{ lisoq_qemu_static_custom_enable | bool }}'
    __lisoq_qemu_package: '{{ (lisoq_qemu_install | bool) and (not lisoq_qemu_static_custom_enable | bool) }}'
    __lisoq_static_local: >-
      {{ lisoq_qemu_static_custom_local
         if ((lisoq_qemu_static_custom_enable | bool) and (lisoq_qemu_static_custom_local is truthy)) else '' }}
    __lisoq_static_url: >-
      {{ lisoq_qemu_static_custom_url
         if ((lisoq_qemu_static_custom_enable | bool) and (lisoq_qemu_static_custom_local is falsy)
             and (lisoq_qemu_static_custom_url is truthy)) else '' }}
    __lisoq_iso_local: "{{ lisoq_iso_file_local if (lisoq_iso_file_local is truthy) else '' }}"
    __lisoq_iso_remote: >-
      {{ lisoq_iso_file_remote
         if ((lisoq_iso_file_local is falsy) and (lisoq_iso_file_remote is truthy)) else '' }}
    __lisoq_iso_url: >-
      {{ lisoq_iso_file_url
         if ((lisoq_iso_file_local is falsy) and (lisoq_iso_file_remote is falsy) and (lisoq_iso_file_url is truthy))
         else '' }}
    # The 'pc' machine takes at most 255 CPUs; QEMU does not start with more (servers with 256+ threads).
    __lisoq_qemu_cpu: >-
      {{ lisoq_qemu_cpu if (lisoq_qemu_cpu is truthy) else ([ansible_processor_vcpus | default(1) | int, 255] | min) }}
    __lisoq_qemu_vnc_port: '{{ (lisoq_qemu_args_port_vnc | int < 5900) | ternary(5901, lisoq_qemu_args_port_vnc | int) }}'
    # The QEMU of this role: '-name lisoq'; older role versions are recognised by the SSH port forwarding.
    # Other VMs on the host (e.g. from libvirt) do not count.
    __lisoq_qemu_pgrep_pattern: >-
      ^(.*/)?qemu-system-x86_64 .*(-name lisoq( |$)
      {%- if lisoq_qemu_args_port_ssh is truthy %}|hostfwd=tcp::{{ lisoq_qemu_args_port_ssh }}-{% endif %})
    # Firewall ports = the ports QEMU actually listens on: SSH/RDP forwarding if set, and the VNC port
    # after the same correction as below (values under 5900 mean 5901).
    __lisoq_acl_ports: >-
      {{ ([lisoq_qemu_args_port_ssh, lisoq_qemu_args_port_rdp] | select('truthy') | map('string') | list)
         + [(lisoq_qemu_args_port_vnc | int < 5900) | ternary(5901, lisoq_qemu_args_port_vnc | int) | string] }}
    __lisoq_ramdisk_dir: "{{ lisoq_ramdisk_path if (lisoq_ramdisk_path is truthy) else lisoq_ramdisk_another_path }}"
    __lisoq_total_need_ram: >-
      {{ lisoq_total_need_ram if (lisoq_total_need_ram is truthy)
         else [((lisoq_ramdisk_enable | bool) | ternary(lisoq_ramdisk_size | int, 0)) + lisoq_qemu_ram | int,
               __need_ram | int] | max }}

# Firewall whitelist: user networks plus the address the Ansible control node connects from, as seen by
# the server. SSH_CONNECTION is 'client_ip client_port server_ip server_port'; it is read without become,
# because sudo removes it from the environment. ansible_become (not only the keyword) is overridden, since an
# inventory ansible_become: true takes precedence over 'become: false'.
- name: Find the address of the Ansible control node as seen by the server
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  vars:
    ansible_become: false
  register: __lisoq_ssh_connection
  changed_when: false
  failed_when: false
  check_mode: false
  when: (lisoq_firewall_acl_enable | bool) and (lisoq_firewall_acl_allow_ansible_ip | bool)

# The whitelists may also be strings ('10.0.0.0/8,192.168.1.0/24' or with spaces) or empty.
- name: Set the firewall whitelists
  ansible.builtin.set_fact:
    __lisoq_ansible_ip: "{{ (__lisoq_ssh_connection.stdout | default('')).split() | first | default('') }}"
    __lisoq_acl_ipv4_white: >-
      {{ (lisoq_firewall_acl_ipv4_white | regex_replace(',', ' ')).split() if (lisoq_firewall_acl_ipv4_white is string)
         else (lisoq_firewall_acl_ipv4_white | default([], true) | list) }}
    __lisoq_acl_ipv6_white: >-
      {{ (lisoq_firewall_acl_ipv6_white | regex_replace(',', ' ')).split() if (lisoq_firewall_acl_ipv6_white is string)
         else (lisoq_firewall_acl_ipv6_white | default([], true) | list) }}

- name: Add the address of the Ansible control node to the firewall whitelist
  ansible.builtin.set_fact:
    __lisoq_acl_ipv4_white: >-
      {{ __lisoq_acl_ipv4_white + ([__lisoq_ansible_ip ~ '/32'] if (':' not in __lisoq_ansible_ip) else []) }}
    __lisoq_acl_ipv6_white: >-
      {{ __lisoq_acl_ipv6_white + ([__lisoq_ansible_ip ~ '/128'] if (':' in __lisoq_ansible_ip) else []) }}
  when: (__lisoq_ansible_ip | length > 0)

- name: The address of the Ansible control node is unknown
  ansible.builtin.debug:
    msg: >-
      Could not detect the address the Ansible control node connects from (no SSH_CONNECTION, e.g. a local
      connection). Only lisoq_firewall_acl_ipv4_white / lisoq_firewall_acl_ipv6_white are allowed to reach
      the QEMU ports.
  when: (lisoq_firewall_acl_enable | bool) and (lisoq_firewall_acl_allow_ansible_ip | bool) and
        (__lisoq_ansible_ip | length == 0)

# QEMU user networking forwards the SSH/RDP ports over IPv4 only (hostfwd does not take an IPv6 address, also
# in QEMU 10), so the IPv6 address of the control node does not give it access to them.
- name: The Ansible control node connects over IPv6
  ansible.builtin.debug:
    msg: >-
      The Ansible control node connects over IPv6 ({{ __lisoq_ansible_ip }}), but QEMU forwards the SSH/RDP ports
      ({{ [lisoq_qemu_args_port_ssh, lisoq_qemu_args_port_rdp] | select('truthy') | join(', ') }}) over IPv4 only.
      To reach them from this host, add its IPv4 address to lisoq_firewall_acl_ipv4_white.
  when: (lisoq_firewall_acl_enable | bool) and (':' in __lisoq_ansible_ip) and
        ((lisoq_qemu_args_port_ssh is truthy) or (lisoq_qemu_args_port_rdp is truthy))

# Otherwise the start tasks are all skipped and the play "succeeds" without a VM.
- name: Check that a QEMU source is selected
  ansible.builtin.fail:
    msg: >-
      lisoq_qemu_enable is true, but no QEMU is selected: set lisoq_qemu_install: true (QEMU from the package
      repository) or lisoq_qemu_static_custom_enable: true (static QEMU from lisoq_qemu_static_custom_url/_local).
  when: (lisoq_qemu_enable | bool) and (not __lisoq_qemu_package | bool) and
        (__lisoq_static_local is falsy) and (__lisoq_static_url is falsy)

# EL8+ have no qemu-system-x86 package, and their qemu-kvm supports neither the 'pc' machine nor IDE disks.
- name: Check that package QEMU is available
  ansible.builtin.fail:
    msg: >-
      lisoq_qemu_install is not supported on {{ ansible_distribution }} {{ ansible_distribution_major_version }}
      (no qemu-system-x86 package). Use the static QEMU: lisoq_qemu_static_custom_enable: true.
  when: (__lisoq_qemu_package | bool) and (ansible_os_family == 'RedHat') and
        (ansible_distribution_major_version | int >= 8)

# Without -vnc QEMU opens a GTK/SDL window and fails on a headless server.
- name: Check lisoq_qemu_vnc_type
  ansible.builtin.fail:
    msg: "lisoq_qemu_vnc_type must be 'local' or 'share', got '{{ lisoq_qemu_vnc_type }}'."
  when: lisoq_qemu_vnc_type not in ['local', 'share']

- name: We use fail if we do not have enough RAM
  ansible.builtin.fail:
    msg: "not enough RAM!"
  when: (ansible_memory_mb.real.total < 512) or (ansible_memory_mb.real.total < (__lisoq_total_need_ram | int))

# A running QEMU of the role is not restarted (start_qemu.yml), and the RAM it uses is not free.
- name: Check whether the QEMU of the role is already running
  ansible.builtin.command:
    argv:
      - pgrep
      - -f
      - '{{ __lisoq_qemu_pgrep_pattern }}'
  register: __lisoq_qemu_running_early
  changed_when: false
  failed_when: false
  check_mode: false

- name: We use fail if we do not have enough RAM for QEMU
  ansible.builtin.fail:
    msg: "QEMU need more RAM ( > 256 MiB )!"
  when: ((lisoq_qemu_ram | int) < 256 ) or
        ((ansible_memory_mb.nocache.free < 256) and (__lisoq_qemu_running_early.rc != 0))

- name: If RamDISK enabled
  when: (lisoq_ramdisk_enable | bool)
  block:

    # ansible.posix.mount cannot remount such a path (it splits the output of 'mount -v' at spaces).
    - name: Check the ramdisk paths
      ansible.builtin.fail:
        msg: 'lisoq_ramdisk_path and lisoq_ramdisk_another_path must not contain spaces.'
      when: (lisoq_ramdisk_path is search('\s')) or (lisoq_ramdisk_another_path is search('\s'))

    # lisoq_ramdisk_path is preferred. lisoq_ramdisk_another_path is used when the first one is already
    # mounted with another filesystem or has one mounted below it (e.g. a server disk on /mnt in rescue mode).
    # An existing tmpfs is reused and only grown, never shrunk.
    # ansible_mounts skips tmpfs, so ask findmnt. Only options of util-linux 2.23 (EL7) are used: no
    # --mountpoint, no -b. In -r output spaces in paths are escaped as \x20; the last entry of a path is
    # the top mount.
    - name: List mounted filesystems
      ansible.builtin.command: findmnt -n -r -o TARGET,FSTYPE,SOURCE
      register: __lisoq_mounts
      changed_when: false
      check_mode: false

    - name: Normalise the ramdisk paths
      ansible.builtin.set_fact:
        __lisoq_ramdisk_main_target: >-
          {{ lisoq_ramdisk_path | regex_replace('(.)/+$', '\1') | replace(' ', '\x20') }}
        __lisoq_ramdisk_other_target: >-
          {{ lisoq_ramdisk_another_path | regex_replace('(.)/+$', '\1') | replace(' ', '\x20') }}

    # *_mount: [FSTYPE, SOURCE] of the top mount on the path, [] if it is not a mount point.
    # A new tmpfs on a directory would hide the filesystems mounted below it (e.g. a server disk on /mnt/data).
    - name: Parse existing mounts of the ramdisk paths
      ansible.builtin.set_fact:
        __lisoq_ramdisk_main_mount: >-
          {{ (__lisoq_mounts.stdout_lines | select('match', (__lisoq_ramdisk_main_target | regex_escape) ~ ' ')
              | list | last | default('')).split()[1:] }}
        __lisoq_ramdisk_other_mount: >-
          {{ (__lisoq_mounts.stdout_lines | select('match', (__lisoq_ramdisk_other_target | regex_escape) ~ ' ')
              | list | last | default('')).split()[1:] }}
        __lisoq_ramdisk_main_submounts: >-
          {{ __lisoq_mounts.stdout_lines | map('split') | map('first')
             | select('match', (__lisoq_ramdisk_main_target | regex_escape) ~ '/') | list }}
        __lisoq_ramdisk_other_submounts: >-
          {{ __lisoq_mounts.stdout_lines | map('split') | map('first')
             | select('match', (__lisoq_ramdisk_other_target | regex_escape) ~ '/') | list }}

    # Usable: an existing tmpfs (it is only remounted), or a directory that is not a mount point and has
    # nothing mounted below it.
    - name: Choose the ramdisk path
      ansible.builtin.set_fact:
        __lisoq_ramdisk_main_ok: >-
          {{ ((__lisoq_ramdisk_main_mount | first | default('')) == 'tmpfs')
             or ((__lisoq_ramdisk_main_mount is falsy) and (__lisoq_ramdisk_main_submounts is falsy)) }}
        __lisoq_ramdisk_other_ok: >-
          {{ ((__lisoq_ramdisk_other_mount | first | default('')) == 'tmpfs')
             or ((__lisoq_ramdisk_other_mount is falsy) and (__lisoq_ramdisk_other_submounts is falsy)) }}

    - name: Fail if neither ramdisk path is free or tmpfs
      ansible.builtin.fail:
        msg: >-
          Cannot create the ramdisk: {{ lisoq_ramdisk_path }} and {{ lisoq_ramdisk_another_path }}
          are mounted with another filesystem or have filesystems mounted below them
          ({{ (__lisoq_ramdisk_main_submounts + __lisoq_ramdisk_other_submounts) | join(', ') }}).
          Set lisoq_ramdisk_path or lisoq_ramdisk_another_path to a free directory.
      when: (not __lisoq_ramdisk_main_ok | bool) and (not __lisoq_ramdisk_other_ok | bool)

    - name: Remember the chosen ramdisk path
      ansible.builtin.set_fact:
        __lisoq_ramdisk_dir: >-
          {{ (__lisoq_ramdisk_main_ok | bool) | ternary(lisoq_ramdisk_path, lisoq_ramdisk_another_path) }}
        __lisoq_ramdisk_mount: >-
          {{ (__lisoq_ramdisk_main_ok | bool) | ternary(__lisoq_ramdisk_main_mount, __lisoq_ramdisk_other_mount) }}

    # Output: total blocks, free blocks, block size.
    - name: Find the size of the existing tmpfs
      ansible.builtin.command:
        argv:
          - stat
          - -f
          - -c
          - '%b %f %S'
          - '{{ __lisoq_ramdisk_dir }}'
      register: __lisoq_ramdisk_statfs
      changed_when: false
      check_mode: false
      when: (__lisoq_ramdisk_mount is truthy)

    - name: Calculate the ramdisk size
      ansible.builtin.set_fact:
        __lisoq_ramdisk_cur_mib: >-
          {{ (((__lisoq_ramdisk_statfs.stdout | default('0 0 0')).split()[0] | int)
              * ((__lisoq_ramdisk_statfs.stdout | default('0 0 0')).split()[2] | int) / 1048576)
             | round(0, 'ceil') | int }}
        __lisoq_ramdisk_used_mib: >-
          {{ ((((__lisoq_ramdisk_statfs.stdout | default('0 0 0')).split()[0] | int)
               - ((__lisoq_ramdisk_statfs.stdout | default('0 0 0')).split()[1] | int))
              * ((__lisoq_ramdisk_statfs.stdout | default('0 0 0')).split()[2] | int) / 1048576)
             | round(0, 'ceil') | int }}

    - name: Calculate the new ramdisk size
      ansible.builtin.set_fact:
        __lisoq_ramdisk_size_mib: >-
          {{ [__lisoq_ramdisk_cur_mib | int, (__lisoq_ramdisk_used_mib | int) + (lisoq_ramdisk_size | int)] | max }}

    - name: Check the ramdisk directory
      ansible.builtin.stat:
        path: '{{ __lisoq_ramdisk_dir }}'
      register: __lisoq_ramdisk_dir_stat
      when: (__lisoq_ramdisk_mount is falsy)

    # Only a missing directory is created. The mode of an existing one (e.g. /mnt) is kept: it is the mode
    # of the mount point again after the tmpfs is unmounted. The tmpfs root itself is 01777.
    - name: Ensure ramdisk directory exists
      ansible.builtin.file:
        dest: '{{ __lisoq_ramdisk_dir }}'
        mode: '0755'
        state: directory
      when: (__lisoq_ramdisk_mount is falsy) and (not __lisoq_ramdisk_dir_stat.stat.exists)

    - name: Ensure ramdisk {{ __lisoq_ramdisk_dir }} is mounted
      ansible.posix.mount:
        path: '{{ __lisoq_ramdisk_dir }}'
        src: "{{ __lisoq_ramdisk_mount[1] | default('tmpfs') }}"
        fstype: tmpfs
        opts: 'size={{ __lisoq_ramdisk_size_mib }}M'
        state: ephemeral
      # An existing tmpfs that is large enough is left alone (a remount would report a change on every run).
      when: (__lisoq_ramdisk_mount is falsy) or ((__lisoq_ramdisk_cur_mib | int) < (__lisoq_ramdisk_size_mib | int))

# Files of the role (ISO, QEMU archives, uefi.bin) are kept in a private subdirectory: the ramdisk path
# is world-writable (tmpfs root, /tmp fallback) and existing files are reused on re-runs, so another
# local user could otherwise plant a binary or an ISO there. See upload_files.yml.
# Static QEMU runs in its data directory (BIOS, keymaps): lisoq_qemu_static_custom_relative_dir inside the
# work directory, with or without leading/trailing slashes.
- name: Set the work directory of the role
  ansible.builtin.set_fact:
    __lisoq_work_dir: '{{ __lisoq_ramdisk_dir }}/lisoq'
    __lisoq_static_data_dir: >-
      {{ __lisoq_ramdisk_dir }}/lisoq/{{ lisoq_qemu_static_custom_relative_dir | default('', true)
         | regex_replace('^/+|/+$', '') | default('share/qemu', true) }}

# QEMU command line: lisoq_qemu_args from the user plus the options added by the role.

# '-name lisoq' marks the VM started by this role (see start_qemu.yml). It comes after lisoq_qemu_args:
# QEMU uses the last -name, so a -name in lisoq_qemu_args cannot hide the VM from the role.
# Without -daemonize QEMU stays in the foreground and the start task never returns, so it is added when
# lisoq_qemu_args (e.g. overridden by the user) does not have it.
- name: Start the QEMU command line with lisoq_qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: >-
      {{ lisoq_qemu_args }}{{ '' if (lisoq_qemu_args is search('(^|\s)-daemonize(\s|$)')) else ' -daemonize' }} -name lisoq

- name: Add net user options to qemu_args. Only port {{ lisoq_qemu_args_port_ssh }}
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -net user,hostfwd=tcp::{{ lisoq_qemu_args_port_ssh }}-:{{ lisoq_iso_file_ssh_port }}'
  when: (lisoq_qemu_args_port_ssh is truthy) and (lisoq_qemu_args_port_rdp is falsy)

- name: Add net user options to qemu_args. Only port {{ lisoq_qemu_args_port_rdp }}
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -net user,hostfwd=tcp::{{ lisoq_qemu_args_port_rdp }}-:{{ lisoq_qemu_args_port_rdp }}'
  when: (lisoq_qemu_args_port_ssh is falsy) and (lisoq_qemu_args_port_rdp is truthy)

- name: Add net user options to qemu_args. Both ports - {{ lisoq_qemu_args_port_ssh }} and {{ lisoq_qemu_args_port_rdp }}
  ansible.builtin.set_fact:
    # https://stackoverflow.com/a/71651490/12646191
    __lisoq_qemu_cmd: >-
      {{ __lisoq_qemu_cmd }} -net user,
      {#- -#}
      hostfwd=tcp::{{ lisoq_qemu_args_port_ssh }}-:{{ lisoq_iso_file_ssh_port }},
      {#- -#}
      hostfwd=tcp::{{ lisoq_qemu_args_port_rdp }}-:{{ lisoq_qemu_args_port_rdp }}
  when: (lisoq_qemu_args_port_ssh is truthy) and (lisoq_qemu_args_port_rdp is truthy)

# Without forwarded ports the VM still gets the user network backend (NAT): '-net nic' alone leaves it without
# Internet access.
- name: Add net user options to qemu_args. No port forwarding
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -net user'
  when: (lisoq_qemu_args_port_ssh is falsy) and (lisoq_qemu_args_port_rdp is falsy)

- name: Add keyboard layot option to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -k en-us'
  when: (__lisoq_qemu_package | bool)

- name: Add keyboard layot option to qemu_args (if using qemu-static-custom).
  ansible.builtin.set_fact:
    # broken keymaps
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -k keymaps/common'
  when: (__lisoq_static_local is truthy) or (__lisoq_static_url is truthy)

- name: Add the local ISO option to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -cdrom {{ (__lisoq_work_dir ~ "/" ~ (__lisoq_iso_local | basename)) | quote }}'
  when: (__lisoq_iso_local is truthy)

- name: Add the remote ISO option to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -cdrom {{ __lisoq_iso_remote | quote }}'
  when: (__lisoq_iso_remote is truthy)

- name: Add an ISO URL option to qemu_args. We will download this ISO later.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -cdrom {{ (__lisoq_work_dir ~ "/" ~ (__lisoq_iso_url | basename)) | quote }}'
  when: (__lisoq_iso_url is truthy)

- name: Add the count of CPU to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -smp {{ __lisoq_qemu_cpu }}'

- name: Set how much RAM to allocate to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -m {{ lisoq_qemu_ram }}M'

# lisoq_qemu_disk may also be a string ('sda,sdb' or 'sda sdb') and names may start with /dev/.
# Autodetected disks are sorted, so they keep their order in QEMU between runs.
- name: Select disks for QEMU (lisoq_qemu_disk or autodetect).
  ansible.builtin.set_fact:
    __lisoq_qemu_disk_autodetect: '{{ lisoq_qemu_disk is falsy }}'
    __lisoq_qemu_disks: >-
      {{ (((lisoq_qemu_disk | regex_replace(',', ' ')).split()) if (lisoq_qemu_disk is string)
          else (lisoq_qemu_disk | list)) | map('regex_replace', '^/dev/', '') | list
         if (lisoq_qemu_disk is truthy)
         else (ansible_devices.keys()
               | reject('match', '^(' ~ (lisoq_qemu_exclude_disk_regular_list | join('|')) ~ ')[0-9]+')
               | difference(lisoq_qemu_exclude_disk) | sort | list) }}

# A disk is in use by the host if it or anything on it is mounted or used as swap, if an active
# md array, LVM volume, dm-crypt/multipath or bcache device sits on it (they write to the disk even
# when not mounted, e.g. an md resync), or if it belongs to an imported ZFS pool or a mounted btrfs
# filesystem (lsblk shows no mountpoint for ZFS and for the other members of a multi-device btrfs).
# Writing to such a disk from QEMU at the same time corrupts it.
- name: Find mount points and active devices on the selected disks
  ansible.builtin.command:
    argv:
      - lsblk
      - -nr
      - -o
      - NAME,TYPE,MOUNTPOINT
      - '/dev/{{ item }}'
  loop: '{{ __lisoq_qemu_disks }}'
  register: __lisoq_qemu_disk_mounts
  changed_when: false
  check_mode: false

- name: List devices of imported ZFS pools
  ansible.builtin.command:
    argv:
      - zpool
      - status
      - -L
      - -P
  register: __lisoq_zpool_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: (__lisoq_qemu_disks | length > 0)

# /sys/fs/btrfs/<fsid>/devices/ lists all member devices of each mounted btrfs filesystem.
- name: List devices of mounted btrfs filesystems
  ansible.builtin.command:
    argv:
      - find
      - /sys/fs/btrfs
      - -mindepth
      - '3'
      - -maxdepth
      - '3'
      - -path
      - '*/devices/*'
  register: __lisoq_btrfs_devices
  changed_when: false
  failed_when: false
  check_mode: false
  when: (__lisoq_qemu_disks | length > 0)

- name: Set the list of disks in use by the host
  ansible.builtin.set_fact:
    __lisoq_qemu_disk_in_use: >-
      {{ (__lisoq_qemu_disk_mounts.results | default([])
         | selectattr('stdout', 'search', '(?m)^\S+ \S+ \S')
         | map(attribute='item') | list
         + __lisoq_qemu_disk_mounts.results | default([])
         | selectattr('stdout', 'search', '(?m)^\S+ (?!(disk|part|loop|rom)( |$))\S+')
         | map(attribute='item') | list
         + __lisoq_qemu_disk_mounts.results | default([])
         | selectattr('stdout', 'search', '\n\S+ disk( |$)')
         | map(attribute='item') | list
         + __lisoq_qemu_disk_mounts.results | default([])
         | selectattr('stdout', 'search', '(?m)^(' ~ ((((__lisoq_zpool_status.stdout | default(''))
                      | regex_findall('/dev/([A-Za-z0-9._-]+)'))
                      + ((__lisoq_btrfs_devices.stdout_lines | default([])) | map('basename') | list))
                      | map('regex_escape') | join('|') | default('(?!)', true)) ~ ') ')
         | map(attribute='item') | list)
         | unique }}

- name: Fail if an explicitly listed disk is in use by the host
  ansible.builtin.fail:
    msg: >-
      Disks {{ __lisoq_qemu_disk_in_use | join(', ') }} from lisoq_qemu_disk are in use by the host (mounted, swap,
      an active md array / LVM / dm / bcache device, an imported ZFS pool or a mounted btrfs). Unmount/stop them first
      (e.g. umount, swapoff, mdadm --stop --scan, vgchange -an, zpool export), remove them from
      lisoq_qemu_disk, or set lisoq_qemu_disk_allow_in_use to true.
  when: (not __lisoq_qemu_disk_autodetect | bool) and (__lisoq_qemu_disk_in_use | length > 0) and
        (not lisoq_qemu_disk_allow_in_use | bool)

- name: Exclude autodetected disks in use by the host
  ansible.builtin.set_fact:
    __lisoq_qemu_disks: "{{ __lisoq_qemu_disks | reject('in', __lisoq_qemu_disk_in_use) | list }}"
  when: (__lisoq_qemu_disk_autodetect | bool) and (__lisoq_qemu_disk_in_use | length > 0) and
        (not lisoq_qemu_disk_allow_in_use | bool)

- name: Report disks excluded from QEMU
  ansible.builtin.debug:
    msg: >-
      Disks in use by the host (mounted, swap, active md/LVM/dm/bcache, imported ZFS, mounted btrfs) are not passed to QEMU:
      {{ __lisoq_qemu_disk_in_use | join(", ") }}. To pass them, stop what uses them first
      (e.g. mdadm --stop --scan, vgchange -an, zpool export) and re-run the role.
  when: (__lisoq_qemu_disk_autodetect | bool) and (__lisoq_qemu_disk_in_use | length > 0) and
        (not lisoq_qemu_disk_allow_in_use | bool)

# Default (lisoq_qemu_disk_allow_in_use: true): all disks go to QEMU, the role only warns. It does not unmount or
# stop anything on the host.
- name: Warn about disks in use by the host that are passed to QEMU
  ansible.builtin.debug:
    msg: >-
      Disks in use by the host (mounted, swap, active md/LVM/dm/bcache, imported ZFS, mounted btrfs) are passed to QEMU
      anyway: {{ __lisoq_qemu_disk_in_use | join(", ") }}. Writing to them from the host and from the VM at the same
      time corrupts them: stop what uses them on the host (e.g. umount, swapoff, mdadm --stop --scan, vgchange -an,
      zpool export), or set lisoq_qemu_disk_allow_in_use: false to leave them out.
  when: (__lisoq_qemu_disk_in_use | length > 0) and (lisoq_qemu_disk_allow_in_use | bool)

# lsblk instead of ansible_devices: lisoq_qemu_disk may also list partitions or other block devices.
# Output: size in bytes, read-only flag.
- name: Find the size of the selected disks
  ansible.builtin.command:
    argv:
      - lsblk
      - -b
      - -d
      - -n
      - -o
      - SIZE,RO
      - '/dev/{{ item }}'
  loop: '{{ __lisoq_qemu_disks }}'
  register: __lisoq_qemu_disk_sizes
  changed_when: false
  check_mode: false

# QEMU cannot open them read-write (e.g. an empty card reader or IPMI virtual floppy), and then does not start.
- name: Find empty and read-only disks
  ansible.builtin.set_fact:
    __lisoq_qemu_disk_unusable: >-
      {{ __lisoq_qemu_disk_sizes.results | default([])
         | rejectattr('stdout', 'match', '^\s*[1-9][0-9]*\s+0\s*$')
         | map(attribute='item') | list }}

- name: Exclude autodetected empty and read-only disks
  ansible.builtin.set_fact:
    __lisoq_qemu_disks: "{{ __lisoq_qemu_disks | reject('in', __lisoq_qemu_disk_unusable) | list }}"
  when: (__lisoq_qemu_disk_autodetect | bool) and (__lisoq_qemu_disk_unusable | length > 0)

- name: Report empty and read-only disks
  ansible.builtin.debug:
    msg: >-
      {{ (__lisoq_qemu_disk_autodetect | bool)
         | ternary('Empty or read-only block devices are not passed to QEMU: ',
                   'QEMU may fail to open these empty or read-only block devices from lisoq_qemu_disk: ') }}
      {{- __lisoq_qemu_disk_unusable | join(', ') }}
  when: (__lisoq_qemu_disk_unusable | length > 0)

- name: Report that QEMU gets no disks
  ansible.builtin.debug:
    msg: 'No disks are passed to QEMU (see lisoq_qemu_disk and the messages above).'
  when: (__lisoq_qemu_disks | length == 0)

- name: Detect disks larger than 2 TiB
  ansible.builtin.set_fact:
    __lisoq_qemu_disk_large: >-
      {{ __lisoq_qemu_disk_sizes.results | default([]) | selectattr('item', 'in', __lisoq_qemu_disks)
         | map(attribute='stdout') | map('split') | map('first') | map('int')
         | select('gt', 2 * 1024 * 1024 * 1024 * 1024) | list | length > 0 }}

# UEFI is opt-in: SeaBIOS sees disks larger than 2 TiB as well (the 2 TiB limit is MBR's), and many ISOs
# (e.g. mfsbsd 12.2, the default before 1.4.0) have no UEFI boot loader, so forcing UEFI made them unbootable.
- name: Decide whether the UEFI firmware is used.
  ansible.builtin.set_fact:
    __lisoq_qemu_uefi: '{{ lisoq_qemu_uefi | bool }}'

- name: Fail if UEFI is requested without static QEMU
  ansible.builtin.fail:
    msg: >-
      lisoq_qemu_uefi requires lisoq_qemu_static_custom_enable: true and lisoq_qemu_static_custom_uefi_url
      (the UEFI firmware comes from that archive).
  when: (__lisoq_qemu_uefi | bool) and
        ((not __lisoq_qemu_static | bool) or (lisoq_qemu_static_custom_uefi_url | length == 0))

- name: Hint about UEFI for disks larger than 2 TiB
  ansible.builtin.debug:
    msg: >-
      A disk larger than 2 TiB is passed to QEMU. It is fully usable in BIOS mode; set lisoq_qemu_uefi: true
      only if the OS must be installed/booted in UEFI mode and the ISO supports UEFI boot.
  when: (__lisoq_qemu_disk_large | bool) and (not __lisoq_qemu_uefi | bool)

# uefi.bin is extracted from lisoq_qemu_static_custom_uefi_url in upload_files.yml (same condition).
- name: Add UEFI firmware to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -bios {{ (__lisoq_work_dir ~ "/uefi.bin") | quote }}'
  when: (__lisoq_qemu_uefi | bool)

# Disks go to the IDE bus as before while they fit: the 'pc' machine has 4 IDE slots and -cdrom takes one.
# More disks ("machine type does not support if=ide,bus=2,unit=0" otherwise) are all attached to
# AHCI (SATA) controllers, 6 ports each; AHCI drivers are built into Windows, Linux and FreeBSD,
# and SeaBIOS boots from it.
- name: Count free IDE slots.
  ansible.builtin.set_fact:
    __lisoq_qemu_ide_free: >-
      {{ 4 - (((__lisoq_iso_local is truthy) or (__lisoq_iso_remote is truthy) or (__lisoq_iso_url is truthy))
              | ternary(1, 0)) }}

- name: Add a list of disk device options to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }}
 -drive ''file=/dev/{{ __lisoq_qemu_disks | join(",format=raw'' -drive ''file=/dev/") }},format=raw''
'
  when: (__lisoq_qemu_disks | length > 0) and (__lisoq_qemu_disks | length <= __lisoq_qemu_ide_free | int)

- name: Add disks to qemu_args on AHCI (SATA) controllers.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: >-
      {{ __lisoq_qemu_cmd }}
      {%- for c in range(((__lisoq_qemu_disks | length) + 5) // 6) %} -device ahci,id=lisoq_ahci{{ c }}{% endfor %}
      {%- for d in __lisoq_qemu_disks %} -drive file=/dev/{{ d }},format=raw,if=none,id=lisoq_disk{{ loop.index0 }}
      -device ide-hd,drive=lisoq_disk{{ loop.index0 }},bus=lisoq_ahci{{ loop.index0 // 6 }}.{{ loop.index0 % 6 }}
      {%- endfor %}
  when: (__lisoq_qemu_disks | length > __lisoq_qemu_ide_free | int)

- name: Add start VNC to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -vnc 127.0.0.1:{{ __lisoq_qemu_vnc_port | int - 5900 }}'
  when: lisoq_qemu_vnc_type == 'local'

- name: Add start VNC to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -vnc :{{ __lisoq_qemu_vnc_port | int - 5900 }}'
  when: lisoq_qemu_vnc_type == 'share'

- name: Add option to boot qemu from ISO to qemu_args.
  ansible.builtin.set_fact:
    __lisoq_qemu_cmd: '{{ __lisoq_qemu_cmd }} -boot {{ (lisoq_qemu_boot_once_cd | bool) | ternary("once=", "") }}d'
  when: (lisoq_qemu_boot_cd | bool)
