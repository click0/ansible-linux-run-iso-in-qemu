---

# Upload (from Ansible host)
# In order not to cache in /root/.ansible/tmp... if there is not enough free disk space.

# The work directory must be private: if it already exists and is not a directory owned by the user the
# role runs as and writable only by it (e.g. pre-created in /tmp by another user), files in it could
# have been planted, so the role stops instead of reusing them.
- name: Check the work directory of the role
  ansible.builtin.stat:
    path: '{{ __lisoq_work_dir }}'
  register: __lisoq_work_dir_stat

- name: Refuse a work directory that others could have prepared
  fail:
    msg: >-
      {{ __lisoq_work_dir }} exists but is not a directory owned by {{ ansible_user_id }} and writable only
      by it, so files in it could have been planted by another user. Remove it and re-run the role.
  when: (__lisoq_work_dir_stat.stat.exists) and
        ((not __lisoq_work_dir_stat.stat.isdir) or (__lisoq_work_dir_stat.stat.uid != (ansible_user_uid | int)) or
         (__lisoq_work_dir_stat.stat.wgrp) or (__lisoq_work_dir_stat.stat.woth))

- name: Create the work directory of the role
  ansible.builtin.file:
    path: '{{ __lisoq_work_dir }}'
    state: directory
    mode: '0700'

# Connection settings of the target host, accepting both current and legacy variable names.
- name: Collect SSH connection settings for uploads
  set_fact:
    __lisoq_ssh_host: "{{ ansible_ssh_host | default(ansible_host) | default(inventory_hostname) }}"
    __lisoq_ssh_port: "{{ ansible_ssh_port | default(ansible_port) | default(22) }}"
    __lisoq_ssh_user: "{{ ansible_ssh_user | default(ansible_user) | default('root') }}"
    __lisoq_ssh_password: "{{ ansible_ssh_password | default(ansible_ssh_pass) | default(ansible_password) | default('') }}"
  no_log: true
  when: (__lisoq_iso_local is truthy) or (__lisoq_static_local is truthy)

- name: Upload file 'lisoq_iso_file_local' via ssh
  # https://stackoverflow.com/a/71651490/12646191
  command: >-
    rsync --copy-links --times
    --rsh="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -p {{ __lisoq_ssh_port }} -l {{ __lisoq_ssh_user }}"
    {{ __lisoq_iso_local | quote }} {{ __lisoq_ssh_host }}:{{ __lisoq_work_dir | quote }}/
  ignore_errors: '{{ ansible_check_mode }}'
  environment:
    SSHPASS: '{{ __lisoq_ssh_password }}'
  no_log: true
  delegate_to: 127.0.0.1
  when: (__lisoq_iso_local is truthy) and (__lisoq_ssh_password | length > 0)

- name: Upload file 'lisoq_iso_file_local' via module 'synchronize'.
  ansible.posix.synchronize:
    src: '{{ __lisoq_iso_local }}'
    dest: '{{ __lisoq_work_dir }}'
    # (default) overwrite on source change
    copy_links: true # Copy symlinks as the item
  ignore_errors: '{{ ansible_check_mode }}'
  when: (__lisoq_iso_local is truthy) and (__lisoq_ssh_password | length == 0)

- name: Upload file 'lisoq_qemu_static_custom_local' via ssh.
  command: >-
    rsync --copy-links --times
    --rsh="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -p {{ __lisoq_ssh_port }} -l {{ __lisoq_ssh_user }}"
    {{ __lisoq_static_local | quote }} {{ __lisoq_ssh_host }}:{{ __lisoq_work_dir | quote }}/
  check_mode: false
  environment:
    SSHPASS: '{{ __lisoq_ssh_password }}'
  no_log: true
  delegate_to: 127.0.0.1
  when: (__lisoq_static_local is truthy) and
        (__lisoq_ssh_password | length > 0)

- name: Upload file 'lisoq_qemu_static_custom_local' via module 'synchronize'.
  ansible.posix.synchronize:
    src: '{{ __lisoq_static_local }}'
    dest: '{{ __lisoq_work_dir }}'
    copy_links: true
  check_mode: false
  when: (__lisoq_static_local is truthy) and
        (__lisoq_ssh_password | length == 0)

# Download files (from Internet)

- name: Download file 'lisoq_iso_file_url'
  ansible.builtin.get_url:
    url: '{{ __lisoq_iso_url }}'
    # A file path (not a directory), so an existing ISO is not downloaded again on every run.
    # The name must match the -cdrom path built in 1-configure.yml.
    dest: '{{ __lisoq_work_dir }}/{{ __lisoq_iso_url | basename }}'
    mode: '0644'
  when: (__lisoq_iso_url is truthy)

# Extract archive

- name: Unarchive file 'lisoq_qemu_static_custom_local'.
  ansible.builtin.unarchive:
    src: '{{ __lisoq_work_dir }}/{{ __lisoq_static_local | basename }}'
    dest: '{{ __lisoq_work_dir }}'
    remote_src: true
    creates: '{{ __lisoq_work_dir }}/qemu-system-x86_64'
  when: (__lisoq_static_local is truthy)

- name: Download and unarchive file 'lisoq_qemu_static_custom_uefi_url'.
  ansible.builtin.unarchive:
    src: '{{ lisoq_qemu_static_custom_uefi_url }}'
    dest: '{{ __lisoq_work_dir }}'
    remote_src: true
    creates: '{{ __lisoq_work_dir }}/uefi.bin'
  when: (__lisoq_qemu_uefi | bool)

- name: Download and unarchive file 'lisoq_qemu_static_custom_url'.
  ansible.builtin.unarchive:
    src: '{{ __lisoq_static_url }}'
    dest: '{{ __lisoq_work_dir }}'
    remote_src: true
    creates: '{{ __lisoq_work_dir }}/qemu-system-x86_64'
  when: (__lisoq_static_url is truthy)
