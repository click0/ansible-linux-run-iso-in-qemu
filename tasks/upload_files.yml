---

# Upload (from Ansible host)
# In order not to cache in /root/.ansible/tmp... if there is not enough free disk space.

# The user Ansible logs in as (also when it comes from remote_user, -u or ~/.ssh/config).
- name: Find the SSH login user
  command: id -un
  become: false
  vars:
    ansible_become: false
  register: __lisoq_login_user
  changed_when: false
  check_mode: false
  when: (__lisoq_iso_local is truthy) or (__lisoq_static_local is truthy)

# Connection settings of the target host, accepting both current and legacy variable names.
# The password must be in an inventory variable: a password typed with --ask-pass is not visible to the role.
# Without a port variable ssh picks the port itself (~/.ssh/config or 22), as it does for Ansible.
- name: Collect SSH connection settings for uploads
  set_fact:
    __lisoq_ssh_host: "{{ ansible_ssh_host | default(ansible_host) | default(inventory_hostname) }}"
    __lisoq_ssh_port: "{{ ansible_ssh_port | default(ansible_port) | default('') }}"
    __lisoq_ssh_user: "{{ __lisoq_login_user.stdout }}"
    __lisoq_ssh_password: "{{ ansible_ssh_password | default(ansible_ssh_pass) | default(ansible_password) | default('') }}"
  no_log: true
  when: (__lisoq_iso_local is truthy) or (__lisoq_static_local is truthy)

# An IPv6 address must be in brackets in rsync's host:path.
- name: Format the target host for rsync
  set_fact:
    __lisoq_rsync_host: "{{ ('[' ~ __lisoq_ssh_host ~ ']') if (':' in __lisoq_ssh_host) else __lisoq_ssh_host }}"
  when: (__lisoq_iso_local is truthy) or (__lisoq_static_local is truthy)

# Local files are uploaded as the SSH login user without become (sudo on the target may need a password,
# which rsync cannot give), so the work directory belongs to it.
- name: Choose the owner of the work directory
  set_fact:
    __lisoq_work_dir_owner: >-
      {{ __lisoq_ssh_user if ((__lisoq_iso_local is truthy) or (__lisoq_static_local is truthy))
         else ansible_user_id }}

# The work directory must be private: if it already exists and is not a directory owned by the user the
# role runs as (or the SSH user) and writable only by it (e.g. pre-created in /tmp by another user), files
# in it could have been planted, so the role stops instead of reusing them.
- name: Check the work directory of the role
  ansible.builtin.stat:
    path: '{{ __lisoq_work_dir }}'
  register: __lisoq_work_dir_stat

- name: Refuse a work directory that others could have prepared
  fail:
    msg: >-
      {{ __lisoq_work_dir }} exists but is not a directory owned by {{ __lisoq_work_dir_owner }} and writable
      only by it, so files in it could have been planted by another user. Remove it and re-run the role.
  when: (__lisoq_work_dir_stat.stat.exists) and
        ((not __lisoq_work_dir_stat.stat.isdir) or
         (__lisoq_work_dir_stat.stat.pw_name not in [ansible_user_id, __lisoq_work_dir_owner]) or
         (__lisoq_work_dir_stat.stat.wgrp) or (__lisoq_work_dir_stat.stat.woth))

- name: Create the work directory of the role
  ansible.builtin.file:
    path: '{{ __lisoq_work_dir }}'
    state: directory
    owner: '{{ __lisoq_work_dir_owner }}'
    mode: '0700'

# In check mode a new work directory is not created, so there is nothing to upload into or check.
- name: The work directory does not exist yet (check mode)
  debug:
    msg: '{{ __lisoq_work_dir }} would be created; uploads and downloads into it are not checked.'
  when: (ansible_check_mode) and (not __lisoq_work_dir_stat.stat.exists)

# Checksums are verified only with lisoq_checksum_enable. Format '<algorithm>:<hex digest>'; for files
# downloaded from a URL also '<algorithm>:<URL of a checksum file>' (as get_url accepts).
- name: Select the checksums to verify
  set_fact:
    __lisoq_checksum_iso: >-
      {{ (lisoq_iso_file_checksum | default('', true))
         if ((lisoq_checksum_enable | bool) and ((__lisoq_iso_local is truthy) or (__lisoq_iso_remote is truthy)
             or (__lisoq_iso_url is truthy))) else '' }}
    __lisoq_checksum_static: >-
      {{ (lisoq_qemu_static_custom_checksum | default('', true))
         if ((lisoq_checksum_enable | bool) and ((__lisoq_static_local is truthy) or (__lisoq_static_url is truthy)))
         else '' }}
    __lisoq_checksum_uefi: >-
      {{ (lisoq_qemu_static_custom_uefi_checksum | default('', true))
         if ((lisoq_checksum_enable | bool) and (__lisoq_qemu_uefi | bool)) else '' }}

- name: Check the checksum settings
  fail:
    msg: >-
      lisoq_checksum_enable is true, but {{ item.var }} is {{ 'empty' if (item.value is falsy) else 'invalid' }}
      ('{{ item.value }}'). Expected '<algorithm>:<hex digest>' (md5, sha1, sha224, sha256, sha384, sha512)
      {{- ", or '<algorithm>:<URL of a checksum file>' for a download" if (item.url | bool) else '' }}.
  loop:
    - var: lisoq_iso_file_checksum
      value: '{{ lisoq_iso_file_checksum | default("") }}'
      used: '{{ (__lisoq_iso_local is truthy) or (__lisoq_iso_remote is truthy) or (__lisoq_iso_url is truthy) }}'
      url: '{{ __lisoq_iso_url is truthy }}'
    - var: lisoq_qemu_static_custom_checksum
      value: '{{ lisoq_qemu_static_custom_checksum | default("") }}'
      used: '{{ (__lisoq_static_local is truthy) or (__lisoq_static_url is truthy) }}'
      url: '{{ __lisoq_static_url is truthy }}'
    - var: lisoq_qemu_static_custom_uefi_checksum
      value: '{{ lisoq_qemu_static_custom_uefi_checksum | default("") }}'
      used: '{{ __lisoq_qemu_uefi | bool }}'
      url: true
  loop_control:
    label: '{{ item.var }}'
  vars:
    __lisoq_checksum_hex_re: '^(md5|sha1|sha224|sha256|sha384|sha512):[0-9A-Fa-f]+$'
    __lisoq_checksum_url_re: '^(md5|sha1|sha224|sha256|sha384|sha512):(https?|ftp|file)://'
  when:
    - lisoq_checksum_enable | bool
    - item.used | bool
    - item.value is not match(__lisoq_checksum_hex_re)
    - not ((item.url | bool) and (item.value is match(__lisoq_checksum_url_re)))

- name: Upload, download and extract files
  when: (not ansible_check_mode) or (__lisoq_work_dir_stat.stat.exists)
  block:

    - name: Upload file 'lisoq_iso_file_local' via ssh
      # https://stackoverflow.com/a/71651490/12646191
      command: >-
        rsync --copy-links --times --itemize-changes --protect-args
        --rsh="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        {{ ('-p ' ~ __lisoq_ssh_port) if (__lisoq_ssh_port is truthy) else '' }} -l {{ __lisoq_ssh_user }}"
        {{ __lisoq_iso_local | quote }} {{ __lisoq_rsync_host }}:{{ __lisoq_work_dir | quote }}/
      register: __lisoq_upload_iso
      changed_when: __lisoq_upload_iso.stdout is truthy
      ignore_errors: '{{ ansible_check_mode }}'
      environment:
        SSHPASS: '{{ __lisoq_ssh_password }}'
      no_log: true
      delegate_to: 127.0.0.1
      # rsync runs on the control node as the user running Ansible, not via sudo there.
      become: false
      vars:
        ansible_become: false
      when: (__lisoq_iso_local is truthy) and (__lisoq_ssh_password | length > 0)

    - name: Upload file 'lisoq_iso_file_local' via module 'synchronize'.
      ansible.posix.synchronize:
        src: '{{ __lisoq_iso_local }}'
        dest: '{{ __lisoq_work_dir }}/'
        # (default) overwrite on source change
        copy_links: true # Copy symlinks as the item
      ignore_errors: '{{ ansible_check_mode }}'
      # As the login user: with become synchronize runs 'sudo rsync' on the target, which fails if sudo
      # asks for a password.
      become: false
      vars:
        ansible_become: false
      when: (__lisoq_iso_local is truthy) and (__lisoq_ssh_password | length == 0)

    - name: Upload file 'lisoq_qemu_static_custom_local' via ssh.
      command: >-
        rsync --copy-links --times --itemize-changes --protect-args
        --rsh="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        {{ ('-p ' ~ __lisoq_ssh_port) if (__lisoq_ssh_port is truthy) else '' }} -l {{ __lisoq_ssh_user }}"
        {{ __lisoq_static_local | quote }} {{ __lisoq_rsync_host }}:{{ __lisoq_work_dir | quote }}/
      register: __lisoq_upload_static
      changed_when: __lisoq_upload_static.stdout is truthy
      ignore_errors: '{{ ansible_check_mode }}'
      environment:
        SSHPASS: '{{ __lisoq_ssh_password }}'
      no_log: true
      delegate_to: 127.0.0.1
      # rsync runs on the control node as the user running Ansible, not via sudo there.
      become: false
      vars:
        ansible_become: false
      when: (__lisoq_static_local is truthy) and
            (__lisoq_ssh_password | length > 0)

    - name: Upload file 'lisoq_qemu_static_custom_local' via module 'synchronize'.
      ansible.posix.synchronize:
        src: '{{ __lisoq_static_local }}'
        dest: '{{ __lisoq_work_dir }}/'
        copy_links: true
      register: __lisoq_sync_static
      ignore_errors: '{{ ansible_check_mode }}'
      become: false
      vars:
        ansible_become: false
      when: (__lisoq_static_local is truthy) and
            (__lisoq_ssh_password | length == 0)

    # Download files (from Internet)

    - name: Download file 'lisoq_iso_file_url'
      ansible.builtin.get_url:
        url: '{{ __lisoq_iso_url }}'
        # A file path (not a directory), so an existing ISO is not downloaded again on every run.
        # The name must match the -cdrom path built in 1-configure.yml.
        dest: '{{ __lisoq_work_dir }}/{{ __lisoq_iso_url | basename }}'
        # Download straight into the work directory, not into remote_tmp (~/.ansible/tmp): on a rescue system
        # the root filesystem is in RAM too and may be too small for an ISO.
        tmp_dest: '{{ __lisoq_work_dir }}'
        mode: '0644'
        # With a checksum an existing file is verified too, and downloaded again if it does not match.
        checksum: '{{ __lisoq_checksum_iso | default(omit, true) }}'
      when: (__lisoq_iso_url is truthy)

    # A local or remote ISO is verified on the target (after the upload).
    - name: Calculate the checksum of the ISO
      ansible.builtin.stat:
        path: >-
          {{ (__lisoq_work_dir ~ '/' ~ (__lisoq_iso_local | basename)) if (__lisoq_iso_local is truthy)
             else __lisoq_iso_remote }}
        get_checksum: true
        checksum_algorithm: "{{ __lisoq_checksum_iso.split(':')[0] }}"
      register: __lisoq_iso_stat
      when: (__lisoq_checksum_iso is truthy) and ((__lisoq_iso_local is truthy) or (__lisoq_iso_remote is truthy))

    - name: Verify the checksum of the ISO
      fail:
        msg: >-
          Checksum mismatch for {{ __lisoq_iso_stat.stat.path | default('the ISO') }}:
          {{ __lisoq_checksum_iso.split(':')[0] }} is {{ __lisoq_iso_stat.stat.checksum | default('(missing file)') }},
          expected {{ __lisoq_checksum_iso.split(':', 1)[1] | lower }} (lisoq_iso_file_checksum).
      when: >-
        (__lisoq_iso_stat.stat is defined) and (not (ansible_check_mode and not __lisoq_iso_stat.stat.exists))
        and ((__lisoq_iso_stat.stat.checksum | default('')) != (__lisoq_checksum_iso.split(':', 1)[1] | lower))

    # Extract archive
    # Archives packed with a './' entry (both default ones) would otherwise give the work directory the owner
    # and mode stored in the archive (e.g. 0755 or the packing user's uid).
    # Without checksums an archive is extracted once ('creates'), straight from the URL. With checksums it is
    # downloaded to the work directory (get_url verifies it) or verified after the upload, and extracted by
    # extract_verified.yml, so the extracted files come from the verified archive.

    - name: Calculate the checksum of 'lisoq_qemu_static_custom_local'
      ansible.builtin.stat:
        path: '{{ __lisoq_work_dir }}/{{ __lisoq_static_local | basename }}'
        get_checksum: true
        checksum_algorithm: "{{ __lisoq_checksum_static.split(':')[0] }}"
      register: __lisoq_static_stat
      when: (__lisoq_static_local is truthy) and (__lisoq_checksum_static is truthy)

    - name: Verify the checksum of 'lisoq_qemu_static_custom_local'
      fail:
        msg: >-
          Checksum mismatch for {{ __lisoq_static_stat.stat.path }}:
          {{ __lisoq_checksum_static.split(':')[0] }} is {{ __lisoq_static_stat.stat.checksum | default('(missing file)') }},
          expected {{ __lisoq_checksum_static.split(':', 1)[1] | lower }} (lisoq_qemu_static_custom_checksum).
      when: >-
        (__lisoq_static_stat.stat is defined) and (not (ansible_check_mode and not __lisoq_static_stat.stat.exists))
        and ((__lisoq_static_stat.stat.checksum | default('')) != (__lisoq_checksum_static.split(':', 1)[1] | lower))

    - name: Unarchive file 'lisoq_qemu_static_custom_local'.
      ansible.builtin.unarchive:
        src: '{{ __lisoq_work_dir }}/{{ __lisoq_static_local | basename }}'
        dest: '{{ __lisoq_work_dir }}'
        remote_src: true
        extra_opts: '{{ [] if (__lisoq_static_local is search("[.]zip$")) else ["--no-same-owner", "--no-overwrite-dir"] }}'
        creates: '{{ __lisoq_work_dir }}/qemu-system-x86_64'
      # In check mode the archive may not have been uploaded.
      ignore_errors: '{{ ansible_check_mode }}'
      when: (__lisoq_static_local is truthy) and (__lisoq_checksum_static is falsy)

    - name: Extract the verified 'lisoq_qemu_static_custom_local'.
      include_tasks: extract_verified.yml
      vars:
        __lisoq_archive: '{{ __lisoq_work_dir }}/{{ __lisoq_static_local | basename }}'
        __lisoq_archive_new: '{{ (__lisoq_upload_static is changed) or (__lisoq_sync_static is changed) }}'
      when: (__lisoq_static_local is truthy) and (__lisoq_checksum_static is truthy)

    - name: Download file 'lisoq_qemu_static_custom_uefi_url' (checksum)
      ansible.builtin.get_url:
        url: '{{ lisoq_qemu_static_custom_uefi_url }}'
        dest: '{{ __lisoq_work_dir }}/{{ lisoq_qemu_static_custom_uefi_url | basename }}'
        tmp_dest: '{{ __lisoq_work_dir }}'
        mode: '0644'
        checksum: '{{ __lisoq_checksum_uefi }}'
      register: __lisoq_download_uefi
      when: (__lisoq_qemu_uefi | bool) and (__lisoq_checksum_uefi is truthy)

    - name: Extract the verified 'lisoq_qemu_static_custom_uefi_url'.
      include_tasks: extract_verified.yml
      vars:
        __lisoq_archive: '{{ __lisoq_work_dir }}/{{ lisoq_qemu_static_custom_uefi_url | basename }}'
        __lisoq_archive_new: '{{ __lisoq_download_uefi is changed }}'
      when: (__lisoq_qemu_uefi | bool) and (__lisoq_checksum_uefi is truthy)

    - name: Download and unarchive file 'lisoq_qemu_static_custom_uefi_url'.
      ansible.builtin.unarchive:
        src: '{{ lisoq_qemu_static_custom_uefi_url }}'
        dest: '{{ __lisoq_work_dir }}'
        remote_src: true
        extra_opts: '{{ [] if (lisoq_qemu_static_custom_uefi_url is search("[.]zip$")) else ["--no-same-owner", "--no-overwrite-dir"] }}'
        creates: '{{ __lisoq_work_dir }}/uefi.bin'
      when: (__lisoq_qemu_uefi | bool) and (__lisoq_checksum_uefi is falsy)

    - name: Download file 'lisoq_qemu_static_custom_url' (checksum)
      ansible.builtin.get_url:
        url: '{{ __lisoq_static_url }}'
        dest: '{{ __lisoq_work_dir }}/{{ __lisoq_static_url | basename }}'
        tmp_dest: '{{ __lisoq_work_dir }}'
        mode: '0644'
        checksum: '{{ __lisoq_checksum_static }}'
      register: __lisoq_download_static
      when: (__lisoq_static_url is truthy) and (__lisoq_checksum_static is truthy)

    - name: Extract the verified 'lisoq_qemu_static_custom_url'.
      include_tasks: extract_verified.yml
      vars:
        __lisoq_archive: '{{ __lisoq_work_dir }}/{{ __lisoq_static_url | basename }}'
        __lisoq_archive_new: '{{ __lisoq_download_static is changed }}'
      when: (__lisoq_static_url is truthy) and (__lisoq_checksum_static is truthy)

    - name: Download and unarchive file 'lisoq_qemu_static_custom_url'.
      ansible.builtin.unarchive:
        src: '{{ __lisoq_static_url }}'
        dest: '{{ __lisoq_work_dir }}'
        remote_src: true
        extra_opts: '{{ [] if (__lisoq_static_url is search("[.]zip$")) else ["--no-same-owner", "--no-overwrite-dir"] }}'
        creates: '{{ __lisoq_work_dir }}/qemu-system-x86_64'
      when: (__lisoq_static_url is truthy) and (__lisoq_checksum_static is falsy)
